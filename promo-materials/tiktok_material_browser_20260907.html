<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Material Browser · 0 results</title>
<style>
:root{--bg:#f7f7f8;--card:#fff;--border:#e5e5e5;--text:#161823;--muted:#757575;--accent:#1d6fd8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif}
header{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);padding:14px 20px;z-index:5}
h1{font-size:18px;margin:0}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
main{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.thumblink{display:block;aspect-ratio:9/16;background:#000;overflow:hidden;max-height:340px}
.thumb{width:100%;height:100%;object-fit:cover;display:block}
.placeholder{display:flex;align-items:center;justify-content:center;color:#aaa;font-size:12px}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.creator{font-weight:600;font-size:14px}
.creator a{color:var(--text);text-decoration:none}
.desc{font-size:13px;color:#444;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.meta{font-size:11px;color:#999}
.open{margin-top:auto;display:inline-block;text-align:center;padding:8px 10px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-size:13px;font-weight:600}
.open:hover{background:#1558b0}
@media (max-width:600px){main{grid-template-columns:1fr}}
</style></head><body>
<header>
  <h1>TikTok Material Browser</h1>
  <div class="sub">0 unique results · queries: Bible app daily devotional · Bible verses for anxiety · Christian morning prayer · Bible study routine · covers: 0/0 · click cover or "Open on TikTok" to view original</div>
</header>
<main></main>
</body></html>
